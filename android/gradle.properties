org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Serialize the build: parallel execution deadlocked at :app:mergeReleaseNativeLibs
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=2

# Skip lint for release builds (lintVitalAnalyzeRelease hangs on this machine).
android.lint.enabled=false
android.lint.checkReleaseBuilds=false
