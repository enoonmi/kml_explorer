org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Gradle性能优化
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# 禁用Kotlin增量编译（解决路径问题）
kotlin.incremental=false

# 网络配置
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000

# SSL配置 - 使用JAVA_HOME路径
systemProp.javax.net.ssl.trustStoreType=JKS
systemProp.javax.net.ssl.trustStore=c:/Users/Lance/AppData/Roaming/Code/User/globalStorage/pleiades.java-extension-pack-jdk/java/17/lib/security/cacerts
systemProp.javax.net.ssl.trustStorePassword=changeit
